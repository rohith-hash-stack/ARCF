[project]
name = "arcf"
version = "0.1.0"
description = "ARCF v2.2 - Deterministic Code Intelligence Architecture"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "litellm>=1.50",
    "tiktoken>=0.8",
    "pyjwt>=2.9",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-api>=1.27",
    "gitpython>=3.1",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/application",
    "src/domain",
    "src/infrastructure",
    "src/interfaces",
    "src/contracts",
    "src/workspace",
    "src/code_intelligence",
    "src/context",
    "src/planning",
    "src/execution",
    "src/validation",
    "src/telemetry",
    "src/governance",
    "src/runtime",
    "src/shared",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
